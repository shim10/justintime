# Local development stack. Cloud deployment (Sprint 2) uses a managed PostgreSQL instead.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: jit
      POSTGRES_PASSWORD: jit_dev_only
      POSTGRES_DB: justintime
    ports: ["5432:5432"]
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://jit:jit_dev_only@db:5432/justintime
    ports: ["8000:8000"]
    depends_on: [db]
